# IPP helm values: RANDOM model routing baseline for the deep-research-agent A/B.
# Same model-name-filter gating as the latency-scorer arm (blog-ocp-qwen-gemma-values.yaml)
# so the request semantics are identical -- planner stays pinned to 32B, summarizer offers
# both -- but instead of scoring on live TTFT the picker chooses uniformly at random among
# the filtered candidates. This is the load-blind control: it cannot offload summarization
# overflow away from a saturating 8B.
payloadProcessor:
  listModels:
    - Qwen/Qwen3-8B
    - Qwen/Qwen3-32B
  customConfig:
    plugins:
    - type: body-field-to-header
      parameters:
        fieldName: model
        headerName: X-Gateway-Model-Name
    - type: base-model-to-header
    - type: model-selector
    - type: model-name-filter
    - type: random-picker
    - type: model-config-datasource
      parameters:
        modelsPath: /config/models.json
    profiles:
    - name: default
      plugins:
        request:
        - pluginRef: model-selector
        - pluginRef: model-name-filter
        - pluginRef: random-picker
        - pluginRef: body-field-to-header
        - pluginRef: base-model-to-header
    datalayer:
      datasources:
      - pluginRef: model-config-datasource
