# IPP helm values (ttft-scorer image): ttft-AWARE scorer over TWO same-model (Qwen3-8B) pools
# registered as aliases -a / -b. model-selector's candidates = listModels (request `model`
# ignored, NO model-name-filter), so every request is scored across BOTH pools; ttft-aware-scorer
# predicts per-pool effectiveTTFT under load and max-score-picker routes to the lower one ->
# load-aware routing that should shift traffic to the 3-pod pool as load climbs.
#
# ttft-scorer image gotchas (see memory ipp-image-ttft-scorer):
#  - scorer plugin is `ttft-aware-scorer` (NOT queue/median-ttft).
#  - session-affinity (a ResponseProcessor) is REQUIRED in the profile response: block: PR #169's
#    streaming path skips the datalayer ResponseEvent, so without it the extractor never records
#    TTFT (RecentN=0) and the scorer routes blind. session-affinity forces response buffering.
#  - helm upgrade WIPES /config/models.json -> re-inject after upgrade + restart the pod:
#    oc patch cm payload-processor -n <ns> --type=merge \
#      -p '{"data":{"models.json":"{\"models\":[{\"name\":\"Qwen/Qwen3-8B-a\"},{\"name\":\"Qwen/Qwen3-8B-b\"}]}"}}'
provider:
  supportedEvents:
    requestTrailers: true
    responseHeaders: true
    responseBody: true
payloadProcessor:
  image:
    # Build the IPP yourself and supply your own registry, e.g.
    #   --set payloadProcessor.image.registry=ghcr.io/<you>
    # The tag below names the IPP build this arm requires.
    tag: ttft-scorer
    pullPolicy: Always
  listModels:
    - Qwen/Qwen3-8B-a
    - Qwen/Qwen3-8B-b
  customConfig:
    plugins:
    - type: body-field-to-header
      parameters:
        fieldName: model
        headerName: X-Gateway-Model-Name
    - type: base-model-to-header
    - type: model-selector
    - type: ttft-aware-scorer
      parameters:
        explorationRate: 0.1
      # effectiveTTFT = P10Low + inflight x (P50 - P10Low) / inflightAtP50
    - type: max-score-picker
    - type: session-affinity   # ResponseProcessor -> forces response buffering so the extractor is fed
    - type: ttft-percentile-extractor
      parameters:
        intervalDuration: 1s
        windowSize: 50000
        maxObservationAge: 3m
        inflightEmaAlpha: 0.2
        lowLoadWindowAge: 1h
        maxRequests: 100
        minRequests: 2
    - type: model-config-datasource
      parameters:
        modelsPath: /config/models.json
    profiles:
    - name: default
      plugins:
        request:
        - pluginRef: model-selector
        - pluginRef: ttft-aware-scorer
          weight: 1.0
        - pluginRef: max-score-picker
        - pluginRef: body-field-to-header
        - pluginRef: base-model-to-header
        response:
        - pluginRef: session-affinity   # NeedsResponseBuffering -> datalayer ResponseEvent -> TTFT recorded
    datalayer:
      extractors:
      - pluginRef: ttft-percentile-extractor
      datasources:
      - pluginRef: model-config-datasource
