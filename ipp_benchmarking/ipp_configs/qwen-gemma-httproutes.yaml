# Header-match HTTPRoutes for the ocp-qwen-gemma-multi scenario.
#
# The current llm-d-benchmark templates no longer render the per-pool
# `experimentalHttpRoute` header-match routes that the (older) kind-sim-multi
# standup produced, so they are applied explicitly after standup:
#
#   kubectl apply -n <namespace> -f ipp_benchmarking/ipp_configs/qwen-gemma-httproutes.yaml
#
# NOTE: the InferencePool names carry a per-standup hash — confirm with
#   kubectl get inferencepool -n <namespace>
# and adjust `backendRefs[0].name` if your standup produced different ones.
# Routing matches on X-Gateway-Base-Model-Name, injected by IPP.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qwen3-8b-route
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: infra-llmdbench-inference-gateway
  rules:
  - backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: qwen-qwe-1a17ef6e-qwen3-8b-gaie
      weight: 1
    matches:
    - headers:
      - name: X-Gateway-Base-Model-Name
        type: Exact
        value: Qwen/Qwen3-8B
      path:
        type: PathPrefix
        value: /
    timeouts:
      request: 120s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qwen3-32b-route
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: infra-llmdbench-inference-gateway
  rules:
  - backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: qwen-qwe-de682216-wen3-32b-gaie
      weight: 1
    matches:
    - headers:
      - name: X-Gateway-Base-Model-Name
        type: Exact
        value: Qwen/Qwen3-32B
      path:
        type: PathPrefix
        value: /
    timeouts:
      request: 120s
