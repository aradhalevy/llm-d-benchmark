# Shadow ttft-aware-scorer (image ttft-aware-p25) over ONLY Qwen3-8B. Single candidate
# in listModels -> model-selector yields one pool, so the scorer runs and LOGS its
# predicted TTFT but max-score-picker cannot route away: observe actual vs predicted.
provider:
  supportedEvents:
    requestTrailers: true
    responseHeaders: true
    responseBody: true
payloadProcessor:
  image:
    registry: ghcr.io/mohammad-nassar10
    tag: ttft-aware-p25
    pullPolicy: Always
  listModels:
    - Qwen/Qwen3-8B
  customConfig:
    plugins:
    - type: body-field-to-header
      parameters:
        fieldName: model
        headerName: X-Gateway-Model-Name
    - type: base-model-to-header
    - type: model-selector
    - type: ttft-aware-scorer
      parameters:
        explorationRate: 0.1
        anchorGapScale: 2.0
    - type: max-score-picker
    - type: ttft-percentile-extractor
      parameters:
        intervalDuration: 1s
        windowSize: 5000
        maxObservationAge: 3m      # short window for P25/P50/anchors
        maxRequests: 100           # short-window cap
        minRequests: 5             # trusted gate
        bucketDuration: 1m         # per-bucket P10 for the floor
        bucketHistorySize: 720     # 12h floor history, min/max evict
    - type: model-config-datasource
      parameters:
        modelsPath: /config/models.json
    profiles:
    - name: default
      plugins:
        request:
        - pluginRef: model-selector
        - pluginRef: ttft-aware-scorer
          weight: 1.0
        - pluginRef: max-score-picker
        - pluginRef: body-field-to-header
        - pluginRef: base-model-to-header
    datalayer:
      extractors:
      - pluginRef: ttft-percentile-extractor
      datasources:
      - pluginRef: model-config-datasource
