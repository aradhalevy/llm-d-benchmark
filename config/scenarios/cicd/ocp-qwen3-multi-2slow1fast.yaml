# OpenShift Multi-Model Qwen3 IPP Scenario -- asymmetric replicas
#
# Variant of `cicd/ocp-qwen3-multi.yaml` that scales the InferencePools
# unevenly: the SLOW dense model (Qwen3-32B) gets 2 decode pods, the FAST
# MoE model (Qwen3-30B-A3B) gets 1 decode pod. Use this to study IPP
# load-aware routing when a pool has multiple identical backends to spread
# load across (the smart picker must pick the least-loaded replica within
# the slow pool, not just the right pool).
#
# Topology:
#   Gateway (infra-llmdbench, shared)
#     HTTPRoute A: X-Gateway-Base-Model-Name: Qwen/Qwen3-30B-A3B -> InferencePool A  (MoE,  "fast", 1 pod)
#     HTTPRoute B: X-Gateway-Base-Model-Name: Qwen/Qwen3-32B     -> InferencePool B  (dense,"slow", 2 pods)
#
# The MoE model is the "fast pod" because Qwen3-30B-A3B activates ~3B
# parameters per token vs. all 32B in Qwen3-32B — at matching batch sizes
# the MoE delivers significantly higher tokens/sec. Giving the slow pool a
# second replica roughly doubles its aggregate throughput so the two pools
# saturate closer together.
#
# Cluster requirements:
#   * OpenShift (or any Kubernetes cluster) with the NVIDIA GPU Operator
#   * GPU nodes with NVIDIA H100 80GB (or H200 / A100 80GB)
#     - 1 GPU per pod x (2 slow + 1 fast) = 3 GPUs minimum
#     - For BF16 weights on a single H100 80GB:
#         Qwen3-30B-A3B fits with --kv-cache-dtype fp8 (recommended)
#         Qwen3-32B is tight; use --kv-cache-dtype fp8 or 2-GPU tensor parallel
#       For fp8/awq quantized variants both fit comfortably on 1x H100 80GB.
#   * StorageClass capable of ReadWriteMany or fast ReadWriteOnce for the
#     model PVC (200Gi total for both checkpoints).
#   * HuggingFace token in `HF_TOKEN` env var for the standup process.
#
# Run (after IPP deployed per IPP_INSTRUCTIONS.md, image pull policy adjusted
# for a registry the cluster can pull from):
#
#   llmdbenchmark --spec cicd/ocp-qwen3-multi-2slow1fast standup -p llmdbench
#   llmdbenchmark --spec cicd/ocp-qwen3-multi-2slow1fast run -l inference-perf \
#       -w saturation_sharegpt.yaml
#   llmdbenchmark --spec cicd/ocp-qwen3-multi-2slow1fast teardown -p llmdbench

# ============================================================================
# SHARED -- merged into every stack before per-stack overrides
# ============================================================================
shared:
  # --- GPU node targeting ---------------------------------------------------
  # Change `labelValue` to whatever your cluster reports for GPU product.
  # `oc get nodes -L nvidia.com/gpu.product` to enumerate.
  affinity:
    enabled: true
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3

  accelerator:
    count: 1                   # 1 GPU per pod
    memory: 80                 # GB on-card

  # --- Deployment method ----------------------------------------------------
  modelservice:
    enabled: true
    uriProtocol: hf            # pull weights from HuggingFace
  standalone:
    enabled: false

  # Per-stack HTTPRoute via experimentalHttpRoute (header-match on
  # X-Gateway-Base-Model-Name); same pattern as kind-sim-multi.
  httpRoute:
    enabled: false

  # --- Gateway / EPP --------------------------------------------------------
  gateway:
    className: istio
    resources:
      limits:   { cpu: "2",    memory: 2Gi }
      requests: { cpu: "500m", memory: 512Mi }

  inferenceExtension:
    experimentalHttpRoute:
      requestTimeout: "60s"
    resources:
      requests: { cpu: "200m", memory: 512Mi }
      limits:   { cpu: "1",    memory: 1Gi }
    monitoring:
      prometheus:
        enabled: true          # OCP has Prometheus available

  monitoring:
    installPrometheusCrds: false   # OCP ships with them already

  # --- vLLM common ----------------------------------------------------------
  vllmCommon:
    shmMemory: 8Gi
    volumes:
      - name: dshm
        type: emptyDir
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm
    flags:
      # Reasonable defaults for both Qwen3 sizes; tune per stack if needed.
      enforceEager: false
      disableLogRequests: true
      disableUvicornAccessLog: true

  # --- Prefill / Decode topology -------------------------------------------
  # Decode-only pods (no P/D disaggregation). `decode.replicas` here is the
  # default (1); the slow pool overrides it to 2 below.
  prefill:
    enabled: false
    replicas: 0

  decode:
    replicas: 1
    parallelism:
      tensor: 1                # single-GPU per pod
      data: 1
      dataLocal: 1
      workers: 1
    accelerator:
      count: 1

  # --- Storage --------------------------------------------------------------
  # 200Gi handles both Qwen3-30B-A3B (~60GB BF16, ~30GB fp8) and
  # Qwen3-32B (~64GB BF16, ~32GB fp8) checkpoints plus headroom.
  storage:
    modelPvc:
      accessModes:
        - ReadWriteOnce
      size: 200Gi
    workloadPvc:
      # RWX so multiple parallel harness pods (-j N) can attach across nodes;
      # the ibm-spectrum-scale-fileset storage class supports ReadWriteMany.
      accessModes:
        - ReadWriteMany
      size: 10Gi

  # --- Harness --------------------------------------------------------------
  harness:
    name: inference-perf
    experimentProfile: saturation_sharegpt.yaml
    resources:
      cpu: "8"
      memory: 32Gi

  workDir: "~/data/ocp-qwen3-multi-2slow1fast"

  # Have the harness scrape vLLM + EPP /metrics every scrapeInterval during the
  # run, saving structured time series to results/.../metrics/ (KV%, running/
  # waiting, prefix-cache, EPP pool gauges). Does NOT capture GPU DCGM/FLOPs —
  # that still comes from tools/collect_dcgm.py.
  monitoring:
    metricsScrapeEnabled: true
    scrapeInterval: "10s"

  # IPP injects X-Gateway-Base-Model-Name; without it the gateway has no
  # backend match (same constraint as kind-sim-multi).
  runConfig:
    skipSmoketest: true
    skipModelVerify: true


# ============================================================================
# SCENARIO -- per-model stacks
# ============================================================================
scenario:
  # --------------------------------------------------------------------------
  # Qwen3-30B-A3B  (MoE, "fast" pod -- 3B active params per token) -- 1 replica
  # --------------------------------------------------------------------------
  - name: "qwen3-30b-a3b"

    model:
      name: Qwen/Qwen3-30B-A3B
      shortName: qwen-qwen3-30b-a3b
      path: models/Qwen/Qwen3-30B-A3B
      huggingfaceId: Qwen/Qwen3-30B-A3B
      size: 70Gi               # checkpoint footprint on PVC
      maxModelLen: 8192
      gpuMemoryUtilization: 0.90

    inferenceExtension:
      experimentalHttpRoute:
        enabled: true
        inferenceGatewayName: infra-llmdbench-inference-gateway
        baseModel: "Qwen/Qwen3-30B-A3B"

    decode:
      replicas: 1              # fast pool: single backend
      resources:
        limits:
          memory: 80Gi
          cpu: "16"
          nvidia.com/gpu: "1"
        requests:
          memory: 80Gi
          cpu: "8"
          nvidia.com/gpu: "1"
      vllm:
        # MoE benefits from larger batch sizes; let vLLM autotune.
        modelCommand: imageDefault

  # --------------------------------------------------------------------------
  # Qwen3-32B  (dense, "slow" pod) -- 2 replicas
  # --------------------------------------------------------------------------
  - name: "qwen3-32b"

    model:
      name: Qwen/Qwen3-32B
      shortName: qwen-qwen3-32b
      path: models/Qwen/Qwen3-32B
      huggingfaceId: Qwen/Qwen3-32B
      size: 70Gi
      maxModelLen: 8192
      gpuMemoryUtilization: 0.90

    inferenceExtension:
      experimentalHttpRoute:
        enabled: true
        inferenceGatewayName: infra-llmdbench-inference-gateway
        baseModel: "Qwen/Qwen3-32B"

    decode:
      replicas: 2              # slow pool: 2 identical backends to spread load
      resources:
        limits:
          memory: 80Gi
          cpu: "16"
          nvidia.com/gpu: "1"
        requests:
          memory: 80Gi
          cpu: "8"
          nvidia.com/gpu: "1"
      vllm:
        modelCommand: imageDefault
