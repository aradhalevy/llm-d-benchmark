# OpenShift Gemma-4 26B-A4B FP8 -- single-GPU smoke test (1 pod / 1 GPU, behind EPP).
# Confirms the fp8 MoE checkpoint fits one H100-80GB and serves through the inference gateway.

shared:
  affinity:
    enabled: true
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
  accelerator:
    count: 1
    memory: 80
  modelservice:
    enabled: true
    uriProtocol: hf
  standalone:
    enabled: false
  httpRoute:
    enabled: false
  gateway:
    className: istio
    resources:
      limits:   { cpu: "2",    memory: 2Gi }
      requests: { cpu: "500m", memory: 512Mi }
  inferenceExtension:
    experimentalHttpRoute:
      requestTimeout: "120s"
    resources:
      requests: { cpu: "200m", memory: 512Mi }
      limits:   { cpu: "1",    memory: 1Gi }
    monitoring:
      prometheus:
        enabled: true
  monitoring:
    installPrometheusCrds: false
  vllmCommon:
    shmMemory: 8Gi
    volumes:
      - name: dshm
        type: emptyDir
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm
    flags:
      enforceEager: false
      disableLogRequests: true
      disableUvicornAccessLog: true
  prefill:
    enabled: false
    replicas: 0
  decode:
    replicas: 1
    parallelism:
      tensor: 1
      data: 1
      dataLocal: 1
      workers: 1
    accelerator:
      count: 1
    # OCP runs the container as an arbitrary UID absent from /etc/passwd; vLLM's torch
    # import calls getpass.getuser() -> getpwuid(<uid>) -> KeyError crashloop. Set these.
    extraEnvVars:
      - name: USER
        value: vllm
      - name: LOGNAME
        value: vllm
  storage:
    modelPvc:
      accessModes:
        - ReadWriteOnce
      size: 200Gi
    workloadPvc:
      accessModes:
        - ReadWriteMany
      size: 96Gi
  workDir: "~/data/ocp-gemma4-26b-fp8-smoke"
  monitoring:
    metricsScrapeEnabled: true
    scrapeInterval: "10s"
  runConfig:
    skipSmoketest: true
    skipModelVerify: true

# Single pool, 1 pod / 1 GPU.
scenario:
  - name: "gemma4-26b-fp8"
    model:
      name: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
      shortName: gemma4-26b-fp8
      path: models/RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
      huggingfaceId: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
      size: 40Gi
      maxModelLen: 8192
      gpuMemoryUtilization: 0.90
    inferenceExtension:
      experimentalHttpRoute:
        enabled: true
        inferenceGatewayName: infra-llmdbench-inference-gateway
        baseModel: "RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic"
    decode:
      replicas: 1
      resources:
        limits:
          memory: 80Gi
          cpu: "16"
          nvidia.com/gpu: "1"
        requests:
          memory: 80Gi
          cpu: "8"
          nvidia.com/gpu: "1"
      vllm:
        modelCommand: imageDefault
