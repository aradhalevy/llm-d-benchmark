# OpenShift dual-pool Qwen3-8B IPP Scenario -- SAME model, two pools, asymmetric replicas.
#
# Two InferencePools serving the SAME model (Qwen3-8B) behind one shared Istio Gateway:
#   InferencePool A: 2 decode pods / 2 GPUs   (model.name alias Qwen/Qwen3-8B-a)
#   InferencePool B: 3 decode pods / 3 GPUs   (model.name alias Qwen/Qwen3-8B-b)
#
# Purpose: compare three routing strategies over the SAME 2+3 topology (analysis later):
#   1. fixed 50/50 weighted HTTPRoute      (tools/gen_weighted_route.sh $NS 1 1)
#   2. smart IPP routing between the pools  (tools/gen_httproutes.sh, dual-pool-smart-values)
#   3. fixed 60/40 weighted HTTPRoute      (tools/gen_weighted_route.sh $NS 3 2  -- expected optimal)
#
# WHY ALIASES: every per-stack resource name (InferencePool, {label}-router EPP, decode
# Deployment) is derived from model_id_label = sha256(namespace/model.name). Two stacks
# with the SAME model.name collide. Distinct model.name aliases give distinct pools; the
# REAL weights still load because huggingfaceId/path stay Qwen/Qwen3-8B, and vLLM answers
# to all three names via the --served-model-name override in additionalFlags (below). The
# IPP model-selector rewrites the request body `model` to the picked alias, so vLLM MUST
# serve that alias -- hence both pools serve {real, -a, -b}.
#
#   llmdbenchmark --spec cicd/ocp-qwen3-8b-dual-pool standup -p llm-d-arad
#   # deploy IPP (ipp_configs/dual-pool-smart-values.yaml), apply the two base-model
#   # ConfigMaps, then drive the three arms with tools/ab_pool_split_run.sh
#   llmdbenchmark --spec cicd/ocp-qwen3-8b-dual-pool teardown -p llm-d-arad
#
# Cluster: OpenShift + NVIDIA GPU Operator, 5x H100 80GB (1 GPU/pod). HF_TOKEN in env.

# ============================================================================
# SHARED -- merged into every stack before per-stack overrides
# ============================================================================
shared:
  affinity:
    enabled: true
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3

  accelerator:
    count: 1
    memory: 80

  modelservice:
    enabled: true
    uriProtocol: hf
  standalone:
    enabled: false

  httpRoute:
    enabled: false

  gateway:
    className: istio
    resources:
      limits:   { cpu: "2",    memory: 2Gi }
      requests: { cpu: "500m", memory: 512Mi }

  inferenceExtension:
    experimentalHttpRoute:
      requestTimeout: "120s"
    resources:
      requests: { cpu: "200m", memory: 512Mi }
      limits:   { cpu: "1",    memory: 1Gi }
    monitoring:
      prometheus:
        enabled: true

  monitoring:
    installPrometheusCrds: false

  vllmCommon:
    shmMemory: 8Gi
    volumes:
      - name: dshm
        type: emptyDir
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm
    flags:
      enforceEager: false
      disableLogRequests: true
      disableUvicornAccessLog: true

  prefill:
    enabled: false
    replicas: 0

  decode:
    replicas: 1
    parallelism:
      tensor: 1
      data: 1
      dataLocal: 1
      workers: 1
    accelerator:
      count: 1
    # We drop modelCommand:imageDefault (to honor additionalFlags), which also drops
    # the image's USER=vllm/LOGNAME=vllm. Without them vLLM's torch import calls
    # getpass.getuser() -> getpwuid(<arbitrary OCP UID>) -> KeyError crashloop. Set them.
    extraEnvVars:
      - name: USER
        value: vllm
      - name: LOGNAME
        value: vllm

  storage:
    modelPvc:
      # Both pools share ONE modelPvc (keyed by model.path); 2+3 pods across nodes
      # mount it -> RWX required (RWO would multi-attach-fail with >1 pod).
      accessModes:
        - ReadWriteMany
      size: 200Gi
    workloadPvc:
      accessModes:
        - ReadWriteMany
      size: 96Gi

  harness:
    name: inference-perf
    experimentProfile: sweep_8stage.yaml
    resources:
      cpu: "8"
      memory: 32Gi

  workDir: "~/data/ocp-qwen3-8b-dual-pool"

  monitoring:
    metricsScrapeEnabled: true
    scrapeInterval: "10s"

  runConfig:
    skipSmoketest: true
    skipModelVerify: true


# ============================================================================
# SCENARIO -- two same-model pools, asymmetric replicas
# ============================================================================
scenario:
  # --------------------------------------------------------------------------
  # InferencePool A -- 2 pods / 2 GPUs
  # --------------------------------------------------------------------------
  - name: "qwen3-8b-a"

    model:
      name: Qwen/Qwen3-8B-a         # alias -> distinct pool identity
      shortName: qwen-qwen3-8b-a
      path: models/Qwen/Qwen3-8B    # REAL weights path (shared PVC subdir)
      huggingfaceId: Qwen/Qwen3-8B  # REAL download
      size: 30Gi
      maxModelLen: 8192
      gpuMemoryUtilization: 0.90

    inferenceExtension:
      experimentalHttpRoute:
        enabled: false              # routes applied manually per arm

    decode:
      replicas: 2
      resources:
        limits:
          memory: 80Gi
          cpu: "16"
          nvidia.com/gpu: "1"
        requests:
          memory: 80Gi
          cpu: "8"
          nvidia.com/gpu: "1"
      vllm:
        # NOT imageDefault (which ignores additionalFlags). The generated command's
        # positional model stays the REAL Qwen/Qwen3-8B (from huggingfaceId) so weights
        # load; append --served-model-name with ALL names (argparse: last one wins) so
        # any pool accepts whatever the IPP rewrites the body `model` to -> the weighted
        # arms route by weight to either pool without 404s.
        additionalFlags:
          - "--served-model-name"
          - "Qwen/Qwen3-8B"
          - "Qwen/Qwen3-8B-a"
          - "Qwen/Qwen3-8B-b"

  # --------------------------------------------------------------------------
  # InferencePool B -- 3 pods / 3 GPUs
  # --------------------------------------------------------------------------
  - name: "qwen3-8b-b"

    model:
      name: Qwen/Qwen3-8B-b
      shortName: qwen-qwen3-8b-b
      path: models/Qwen/Qwen3-8B
      huggingfaceId: Qwen/Qwen3-8B
      size: 30Gi
      maxModelLen: 8192
      gpuMemoryUtilization: 0.90

    inferenceExtension:
      experimentalHttpRoute:
        enabled: false

    decode:
      replicas: 3
      resources:
        limits:
          memory: 80Gi
          cpu: "16"
          nvidia.com/gpu: "1"
        requests:
          memory: 80Gi
          cpu: "8"
          nvidia.com/gpu: "1"
      vllm:
        additionalFlags:
          - "--served-model-name"
          - "Qwen/Qwen3-8B"
          - "Qwen/Qwen3-8B-a"
          - "Qwen/Qwen3-8B-b"
